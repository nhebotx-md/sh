<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720">
    <!-- Background -->
    <g>
        <image id="_bg_image" x="0" y="0" width="1280" height="720" xlink:href="" />
    </g>

    <!-- Profile Picture -->
    <g>
        <circle cx="640" cy="250" r="120" fill="white" stroke="black" stroke-width="10" />
        <image id="_pp_image" x="520" y="130" width="240" height="240" xlink:href="" />
    </g>

    <!-- Welcome Text -->
    <text id="_welcome_text" x="640" y="550" font-family="Sans" font-weight="bold" font-style="italic" font-size="40" text-anchor="middle" fill="white"></text>
    <text id="_name_text" x="640" y="600" font-family="Sans" font-weight="bold" font-style="italic" font-size="30" text-anchor="middle" fill="white"></text>
    <text id="_group_text" x="640" y="650" font-family="Sans" font-weight="bold" font-style="italic" font-size="30" text-anchor="middle" fill="white"></text>
</svg>